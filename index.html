<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="mobile-web-app-capable" content="yes">
<title>Tredemølle</title>
<style>
:root{
  --bg:#0b0d10; --panel:#14181d; --panel2:#1b2027; --line:#262c35;
  --txt:#f2f4f7; --mute:#8a94a3; --accent:#4cc2ff;
  --ok:#3ddc84; --warn:#ffb020; --bad:#ff5a5f;
  --z1:#7c8a9e; --z2:#4c9cff; --z3:#3ddc84; --z4:#ffb020; --z5:#ff4d5e;
  --hr:#ff5a7a; --pw:#ffc83d; --pace:#4cc2ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) 14px 10px;gap:10px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* Topplinje */
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
  border-radius:999px;padding:8px 14px;font-size:15px;cursor:pointer;color:var(--txt)}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--bad);flex:none}
.chip.on .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.chip.wait .dot{background:var(--warn);animation:blink 1s infinite}
.chip small{color:var(--mute);font-size:13px}
@keyframes blink{50%{opacity:.3}}
.spacer{flex:1}
button.b{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:12px;
  padding:9px 14px;font-size:15px;cursor:pointer}
button.b:active{transform:scale(.97)}
button.b.primary{background:var(--accent);color:#04121c;border-color:transparent;font-weight:600}
button.b.icon{padding:9px 12px}

#banner{display:none;background:#3a1d1f;border:1px solid #6b2a2e;color:#ffd5d6;padding:10px 14px;border-radius:12px;font-size:15px}

/* Hovedtall */
#main{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:0 0 auto}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:12px 18px 14px;
  position:relative;overflow:hidden;display:flex;flex-direction:column;min-width:0;transition:border-color .4s, background .4s}
.tile .lbl{font-size:clamp(14px,1.7vw,22px);color:var(--mute);letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.tile .lbl b{font-weight:700;color:var(--zc,var(--mute))}
.tile .val{font-size:clamp(64px,13.5vw,220px);font-weight:700;line-height:.95;letter-spacing:-.03em;margin-top:4px;white-space:nowrap}
.tile .unit{font-size:clamp(16px,2vw,28px);color:var(--mute);margin-top:2px}
.tile .bar{position:absolute;left:0;right:0;bottom:0;height:8px;background:var(--zc,transparent);opacity:.9;transition:background .4s}
.tile.hr .val{color:var(--hr)} .tile.pw .val{color:var(--pw)} .tile.pace .val{color:var(--pace)}
.tile.stale .val{opacity:.25}
.tile .val.long{font-size:clamp(52px,10.8vw,176px)}
.tile[data-z]{border-color:color-mix(in srgb,var(--zc) 55%,var(--line));
  background:linear-gradient(180deg,color-mix(in srgb,var(--zc) 12%,var(--panel)),var(--panel))}

/* Sekundærtall */
#sec{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;flex:0 0 auto}
.s{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px 12px;min-width:0}
.s .lbl{font-size:clamp(11px,1.15vw,15px);color:var(--mute);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s .v{font-size:clamp(24px,3.6vw,52px);font-weight:650;line-height:1.05;white-space:nowrap}
.s .v small{font-size:.45em;color:var(--mute);font-weight:500;margin-left:3px}

/* Graf */
#chartWrap{flex:1 1 auto;min-height:90px;background:var(--panel);border:1px solid var(--line);border-radius:16px;position:relative}
#chart{position:absolute;inset:0;width:100%;height:100%}
#legend{position:absolute;top:8px;left:14px;font-size:13px;color:var(--mute);display:flex;gap:14px}
#legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}

/* Kontroller nederst */
footer{display:flex;gap:10px;align-items:center}
footer button.b{padding:12px 22px;font-size:17px}
#lapInfo{color:var(--mute);font-size:15px}

/* Stående */
@media (orientation:portrait){
  #main{grid-template-columns:1fr 1fr}
  #main .tile.hr{grid-column:1 / -1}
  .tile .val{font-size:clamp(64px,19vw,260px)}
  .tile .val.long{font-size:clamp(52px,15vw,210px)}
  #sec{grid-template-columns:repeat(4,1fr)}
  .s .v{font-size:clamp(24px,5.5vw,56px)}
}
@media (max-height:620px) and (orientation:landscape){
  #chartWrap{display:none}
}

dialog{margin:auto;background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:18px;padding:22px;width:min(460px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{font-size:20px;margin-bottom:14px}
dialog label{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:16px}
dialog label span small{display:block;color:var(--mute);font-size:12px}
dialog input[type=number]{width:96px;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px;font-size:16px;text-align:right}
dialog input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
dialog .row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
</style>
</head>
<body>

<header>
  <div class="chip" id="chipHr" title="Trykk for å koble til pulsbelte"><span class="dot"></span><span>Pulsbelte</span><small id="hrInfo">trykk for å koble til</small></div>
  <div class="chip" id="chipSt" title="Trykk for å koble til Stryd"><span class="dot"></span><span>Stryd</span><small id="stInfo">trykk for å koble til</small></div>
  <div class="spacer"></div>
  <button class="b icon" id="btnDemo" title="Demomodus">Demo</button>
  <button class="b icon" id="btnSettings" title="Innstillinger">⚙︎</button>
  <button class="b icon" id="btnFull" title="Fullskjerm">⛶</button>
</header>

<div id="banner"></div>

<section id="main">
  <div class="tile hr stale" id="tHr">
    <div class="lbl"><span>Puls</span><b id="hrZone"></b></div>
    <div class="val num" id="vHr">--</div>
    <div class="unit" id="hrSub">slag/min</div>
    <div class="bar"></div>
  </div>
  <div class="tile pw stale" id="tPw">
    <div class="lbl"><span>Watt <span id="pwSmooth"></span></span><b id="pwZone"></b></div>
    <div class="val num" id="vPw">--</div>
    <div class="unit" id="pwSub">W</div>
    <div class="bar"></div>
  </div>
  <div class="tile pace stale" id="tPace">
    <div class="lbl"><span>Pace</span><b id="paceKmh"></b></div>
    <div class="val num" id="vPace">--:--</div>
    <div class="unit">min/km</div>
    <div class="bar"></div>
  </div>
</section>

<section id="sec">
  <div class="s"><div class="lbl">Tid</div><div class="v num" id="sTime">0:00</div></div>
  <div class="s"><div class="lbl">Distanse</div><div class="v num" id="sDist">0.00<small>km</small></div></div>
  <div class="s"><div class="lbl">Fart</div><div class="v num" id="sKmh">--<small>km/t</small></div></div>
  <div class="s"><div class="lbl">Kadens</div><div class="v num" id="sCad">--<small>spm</small></div></div>
  <div class="s"><div class="lbl">Snitt watt</div><div class="v num" id="sAvgPw">--<small>W</small></div></div>
  <div class="s"><div class="lbl">Snitt puls</div><div class="v num" id="sAvgHr">--</div></div>
  <div class="s"><div class="lbl">Snitt pace</div><div class="v num" id="sAvgPace">--:--</div></div>
</section>

<div id="chartWrap">
  <canvas id="chart"></canvas>
  <div id="legend"><span><i style="background:var(--hr)"></i>Puls</span><span><i style="background:var(--pw)"></i>Watt</span><span id="chartSpan">siste 10 min</span></div>
</div>

<footer>
  <button class="b primary" id="btnStart">Start</button>
  <button class="b" id="btnLap">Runde</button>
  <button class="b" id="btnReset">Nullstill</button>
  <span id="lapInfo"></span>
</footer>

<dialog id="dlg">
  <h2>Innstillinger</h2>
  <label><span>Makspuls<small>for pulssoner (% av maks)</small></span><input type="number" id="setMaxHr" min="120" max="230"></label>
  <label><span>Critical Power (CP)<small>for Stryd-soner, i watt</small></span><input type="number" id="setCp" min="50" max="600"></label>
  <label><span>Utjevning watt<small>sekunder snitt (Stryd anbefaler 3–10)</small></span><input type="number" id="setPwS" min="1" max="30"></label>
  <label><span>Utjevning pace<small>sekunder snitt</small></span><input type="number" id="setPaceS" min="1" max="30"></label>
  <label><span>Doble kadens<small>slå på hvis kadensen vises halvert</small></span><input type="checkbox" id="setCadX2"></label>
  <label><span>Autostart/pause<small>tid går bare når du løper</small></span><input type="checkbox" id="setAuto"></label>
  <div class="row"><button class="b" id="dlgCancel">Avbryt</button><button class="b primary" id="dlgSave">Lagre</button></div>
</dialog>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);

/* ---------- Innstillinger ---------- */
const DEF = {maxHr:190, cp:280, pwS:3, paceS:5, cadX2:false, auto:true};
let cfg = {...DEF};
try { Object.assign(cfg, JSON.parse(localStorage.getItem('tm-cfg') || '{}')); } catch(e){}
const saveCfg = () => { try { localStorage.setItem('tm-cfg', JSON.stringify(cfg)); } catch(e){} };

/* ---------- Måledata ---------- */
const buf = { pw:[], spd:[] };          // [tid, verdi] for utjevning
const live = { hr:null, hrT:0, pwT:0, spdT:0, cad:null, cadT:0 };
const hist = [];                          // {hr, pw} per sekund, maks 600
const HIST_MAX = 600;

const sess = {
  running:false, elapsed:0, dist:0,
  sumPw:0, nPw:0, sumHr:0, nHr:0,
  lap:{n:1, elapsed:0, dist:0, sumPw:0, nPw:0},
  lastMove:0
};

function push(arr, v, keepMs=31000){
  const t = performance.now();
  arr.push([t,v]);
  while (arr.length && t - arr[0][0] > keepMs) arr.shift();
}
function avg(arr, secs){
  const t = performance.now() - secs*1000;
  let s=0,n=0;
  for (let i=arr.length-1;i>=0 && arr[i][0]>=t;i--){ s+=arr[i][1]; n++; }
  return n ? s/n : null;
}
const fresh = (t, ms=4000) => t && performance.now()-t < ms;

/* ---------- Formatering ---------- */
function fmtPace(mps){
  if (!mps || mps < 0.6) return '--:--';
  let s = Math.round(1000/mps);
  if (s >= 3600) return '--:--';
  return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
}
function fmtTime(ms){
  let s = Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor(s%3600/60); s%=60;
  return (h? h+':'+String(m).padStart(2,'0') : m) + ':' + String(s).padStart(2,'0');
}

/* ---------- Soner ---------- */
const HR_Z = [[0.9,5,'Z5'],[0.8,4,'Z4'],[0.7,3,'Z3'],[0.6,2,'Z2'],[0,1,'Z1']];
function hrZone(hr){ const p=hr/cfg.maxHr; for (const [lim,z,l] of HR_Z) if (p>=lim) return {z,l:l+' · '+Math.round(p*100)+'%'}; }
// Stryd-soner (% av CP): Easy <80, Moderate 80–90, Threshold 90–100, Interval 100–115, Repetition >115
const PW_Z = [[1.15,5,'Repetisjon'],[1.0,4,'Intervall'],[0.9,3,'Terskel'],[0.8,2,'Moderat'],[0,1,'Rolig']];
function pwZone(w){ const p=w/cfg.cp; for (const [lim,z,l] of PW_Z) if (p>=lim) return {z,l:l+' · '+Math.round(p*100)+'%'}; }
function setZone(tile, z){
  if (z){ tile.dataset.z=z; tile.style.setProperty('--zc',`var(--z${z})`); }
  else { delete tile.dataset.z; tile.style.removeProperty('--zc'); }
}

/* ---------- BLE-parsing ---------- */
function onHr(dv){
  const f = dv.getUint8(0);
  const hr = (f & 1) ? dv.getUint16(1,true) : dv.getUint8(1);
  if (hr > 0){ live.hr = hr; live.hrT = performance.now(); }
}
function onRsc(dv){
  // Running Speed and Cadence Measurement (0x2A53)
  const spd = dv.getUint16(1,true)/256;   // m/s
  const cad = dv.getUint8(3);             // per minutt
  push(buf.spd, spd); live.spdT = performance.now();
  live.cad = cad; live.cadT = performance.now();
}
function onPower(dv){
  // Cycling Power Measurement (0x2A63) – Stryd sender løpewatt her
  const w = dv.getInt16(2,true);
  push(buf.pw, Math.max(0,w)); live.pwT = performance.now();
}

/* ---------- Bluetooth ---------- */
const dev = { hr:null, st:null };
const manualOff = { hr:false, st:false };
const retry = { hr:0, st:0 };

function chip(kind, state, text){
  const c = kind==='hr' ? $('chipHr') : $('chipSt');
  c.classList.toggle('on', state==='on'); c.classList.toggle('wait', state==='wait');
  (kind==='hr' ? $('hrInfo') : $('stInfo')).textContent = text;
}

async function pick(kind){
  if (!navigator.bluetooth) return showBanner();
  if (demo.on) stopDemo();
  const opts = kind==='hr'
    ? { filters:[{services:['heart_rate']}], optionalServices:['battery_service'] }
    : { filters:[{namePrefix:'Stryd'},{services:['running_speed_and_cadence']},{services:['cycling_power']}],
        optionalServices:['running_speed_and_cadence','cycling_power','battery_service'] };
  try {
    const d = await navigator.bluetooth.requestDevice(opts);
    if (dev[kind] && dev[kind] !== d && dev[kind].gatt.connected){ manualOff[kind]=true; dev[kind].gatt.disconnect(); }
    dev[kind] = d; manualOff[kind] = false; retry[kind] = 0;
    if (!d._tmBound){ d.addEventListener('gattserverdisconnected', () => onDisc(kind, d)); d._tmBound = true; }
    await connect(kind);
  } catch(e){
    if (e.name !== 'NotFoundError') chip(kind,'off','feil: '+e.message);
  }
}

async function connect(kind){
  const d = dev[kind]; if (!d) return;
  chip(kind,'wait','kobler til '+(d.name||'')+'…');
  const srv = await d.gatt.connect();
  let ok = false;
  if (kind==='hr'){
    const s = await srv.getPrimaryService('heart_rate');
    const c = await s.getCharacteristic('heart_rate_measurement');
    c.addEventListener('characteristicvaluechanged', e => onHr(e.target.value));
    await c.startNotifications(); ok = true;
  } else {
    try {
      const s = await srv.getPrimaryService('running_speed_and_cadence');
      const c = await s.getCharacteristic('rsc_measurement');
      c.addEventListener('characteristicvaluechanged', e => onRsc(e.target.value));
      await c.startNotifications(); ok = true;
    } catch(e){ console.warn('RSC ikke tilgjengelig', e); }
    try {
      const s = await srv.getPrimaryService('cycling_power');
      const c = await s.getCharacteristic('cycling_power_measurement');
      c.addEventListener('characteristicvaluechanged', e => onPower(e.target.value));
      await c.startNotifications(); ok = true;
    } catch(e){ console.warn('Power ikke tilgjengelig', e); }
  }
  if (!ok) throw new Error('fant ingen data-tjenester');
  let bat = '';
  try {
    const b = await (await srv.getPrimaryService('battery_service')).getCharacteristic('battery_level');
    bat = ' · 🔋' + (await b.readValue()).getUint8(0) + '%';
  } catch(e){}
  retry[kind] = 0;
  chip(kind,'on',(d.name||'tilkoblet') + bat);
  requestWake();
}

function onDisc(kind, d){
  if (dev[kind] !== d || manualOff[kind]) { chip(kind,'off','frakoblet'); return; }
  const n = ++retry[kind];
  const wait = Math.min(15000, 1000 * n);
  chip(kind,'wait',`mistet forbindelse – prøver igjen (${n})`);
  setTimeout(() => {
    if (dev[kind] !== d || d.gatt.connected) return;
    connect(kind).catch(() => onDisc(kind, d));
  }, wait);
}

$('chipHr').onclick = () => pick('hr');
$('chipSt').onclick = () => pick('st');

/* ---------- Skjerm våken + fullskjerm ---------- */
let wake = null;
async function requestWake(){
  try { if ('wakeLock' in navigator && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release',()=>wake=null); } } catch(e){}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState==='visible') requestWake(); });
document.addEventListener('pointerdown', requestWake, {once:true});
$('btnFull').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.({navigationUI:'hide'}).catch(()=>{});
  requestWake();
};

function showBanner(){
  const b = $('banner');
  if (!window.isSecureContext) b.textContent = 'Siden må åpnes via https:// (eller localhost) for at Bluetooth skal virke.';
  else b.textContent = 'Denne nettleseren støtter ikke Web Bluetooth. Bruk Chrome på Samsung-nettbrettet. (Demo-knappen viser hvordan det ser ut.)';
  b.style.display = 'block';
}
if (!navigator.bluetooth || !window.isSecureContext) showBanner();

/* ---------- Økt ---------- */
function setRunning(on){
  sess.running = on;
  $('btnStart').textContent = on ? 'Pause' : (sess.elapsed ? 'Fortsett' : 'Start');
  $('btnStart').classList.toggle('primary', !on);
}
$('btnStart').onclick = () => { setRunning(!sess.running); sess.manual = true; requestWake(); };
$('btnReset').onclick = () => {
  if (sess.elapsed && !confirm('Nullstille økta?')) return;
  Object.assign(sess, {running:false, elapsed:0, dist:0, sumPw:0, nPw:0, sumHr:0, nHr:0, manual:false,
    lap:{n:1, elapsed:0, dist:0, sumPw:0, nPw:0}});
  hist.length = 0; laps.length = 0; $('lapInfo').textContent=''; setRunning(false);
};
const laps = [];
$('btnLap').onclick = () => {
  const L = sess.lap;
  if (L.elapsed < 1000) return;
  laps.push({...L});
  const p = L.nPw ? Math.round(L.sumPw/L.nPw)+' W' : '';
  const pace = L.dist>0 ? fmtPace(L.dist/(L.elapsed/1000))+'/km' : '';
  $('lapInfo').textContent = `Runde ${L.n}: ${fmtTime(L.elapsed)} · ${(L.dist/1000).toFixed(2)} km · ${p} · ${pace}`;
  sess.lap = {n:L.n+1, elapsed:0, dist:0, sumPw:0, nPw:0};
};

/* ---------- Sekundtakt: integrer og lagre historikk ---------- */
let lastTick = performance.now();
setInterval(() => {
  const now = performance.now(), dt = now - lastTick; lastTick = now;
  const spd = fresh(live.spdT) ? (avg(buf.spd, 2) ?? 0) : 0;
  const pw  = fresh(live.pwT) ? avg(buf.pw, 1) : null;
  const hr  = fresh(live.hrT) ? live.hr : null;

  if (cfg.auto && !sess.manual){
    if (spd > 0.8) { sess.lastMove = now; if (!sess.running) setRunning(true); }
    else if (sess.running && now - sess.lastMove > 3000) setRunning(false);
  }
  if (sess.running){
    sess.elapsed += dt; sess.lap.elapsed += dt;
    const d = spd * dt/1000; sess.dist += d; sess.lap.dist += d;
    if (pw != null){ sess.sumPw += pw; sess.nPw++; sess.lap.sumPw += pw; sess.lap.nPw++; }
    if (hr != null){ sess.sumHr += hr; sess.nHr++; }
  }
  hist.push({hr, pw: pw!=null ? avg(buf.pw, 3) : null});
  if (hist.length > HIST_MAX) hist.shift();
}, 1000);

/* ---------- Visning (4x/sek) ---------- */
function render(){
  // Puls
  const hrOk = fresh(live.hrT, 5000);
  $('tHr').classList.toggle('stale', !hrOk);
  $('vHr').textContent = hrOk ? live.hr : '--';
  const hz = hrOk ? hrZone(live.hr) : null;
  $('hrZone').textContent = hz ? hz.l : ''; setZone($('tHr'), hz?.z);

  // Watt
  const pwOk = fresh(live.pwT);
  const w = pwOk ? avg(buf.pw, cfg.pwS) : null;
  $('tPw').classList.toggle('stale', w==null);
  $('vPw').textContent = w!=null ? Math.round(w) : '--';
  $('pwSmooth').textContent = cfg.pwS>1 ? `(${cfg.pwS}s)` : '';
  const pz = w!=null && w>0 ? pwZone(w) : null;
  $('pwZone').textContent = pz ? pz.l : ''; setZone($('tPw'), pz?.z);
  $('pwSub').textContent = w!=null && cfg.cp ? `W · ${(w/cfg.cp*100).toFixed(0)}% av CP ${cfg.cp}` : 'W';

  // Pace
  const spOk = fresh(live.spdT);
  const sp = spOk ? avg(buf.spd, cfg.paceS) : null;
  $('tPace').classList.toggle('stale', !sp || sp<0.6);
  const pTxt = fmtPace(sp);
  $('vPace').textContent = pTxt;
  $('vPace').classList.toggle('long', pTxt.length > 4);
  $('paceKmh').textContent = sp>0.6 ? (sp*3.6).toFixed(1)+' km/t' : '';
  $('sKmh').innerHTML = (sp>0.6 ? (sp*3.6).toFixed(1) : '--') + '<small>km/t</small>';

  // Kadens
  const cadOk = fresh(live.cadT) && live.cad > 0;
  $('sCad').innerHTML = (cadOk ? live.cad*(cfg.cadX2?2:1) : '--') + '<small>spm</small>';

  // Økt
  $('sTime').textContent = fmtTime(sess.elapsed);
  $('sDist').innerHTML = (sess.dist/1000).toFixed(2) + '<small>km</small>';
  $('sAvgPw').innerHTML = (sess.nPw ? Math.round(sess.sumPw/sess.nPw) : '--') + '<small>W</small>';
  $('sAvgHr').textContent = sess.nHr ? Math.round(sess.sumHr/sess.nHr) : '--';
  $('sAvgPace').textContent = sess.elapsed>5000 && sess.dist>10 ? fmtPace(sess.dist/(sess.elapsed/1000)) : '--:--';
}
setInterval(render, 250);

/* ---------- Graf ---------- */
const cv = $('chart'), ctx = cv.getContext('2d');
function drawChart(){
  const r = cv.getBoundingClientRect(); if (!r.width) return;
  const dpr = window.devicePixelRatio || 1;
  if (cv.width !== Math.round(r.width*dpr)) { cv.width = Math.round(r.width*dpr); cv.height = Math.round(r.height*dpr); }
  const W = cv.width, H = cv.height, padT = 30*dpr, padB = 8*dpr;
  ctx.clearRect(0,0,W,H);
  const cs = getComputedStyle(document.documentElement);
  // rutenett
  ctx.strokeStyle = cs.getPropertyValue('--line'); ctx.lineWidth = 1;
  for (let i=1;i<10;i++){ const x = W*i/10; ctx.beginPath(); ctx.moveTo(x,padT); ctx.lineTo(x,H-padB); ctx.stroke(); }
  const plot = (key, color, lo, hi) => {
    ctx.strokeStyle = color; ctx.lineWidth = 2.5*dpr; ctx.lineJoin='round'; ctx.beginPath();
    let pen = false;
    const off = HIST_MAX - hist.length;
    hist.forEach((p,i) => {
      const v = p[key];
      if (v==null){ pen=false; return; }
      const x = (off+i)/(HIST_MAX-1)*W;
      const y = H-padB - (Math.min(hi,Math.max(lo,v))-lo)/(hi-lo)*(H-padT-padB);
      pen ? ctx.lineTo(x,y) : ctx.moveTo(x,y); pen = true;
    });
    ctx.stroke();
  };
  // skaler etter data
  const hrs = hist.map(p=>p.hr).filter(v=>v!=null), pws = hist.map(p=>p.pw).filter(v=>v!=null);
  const hrLo = hrs.length ? Math.min(...hrs)-10 : 80, hrHi = hrs.length ? Math.max(...hrs)+10 : 190;
  const pwLo = pws.length ? Math.max(0,Math.min(...pws)-30) : 0, pwHi = pws.length ? Math.max(...pws)+30 : 400;
  // CP-linje
  if (cfg.cp > pwLo && cfg.cp < pwHi){
    const y = H-padB - (cfg.cp-pwLo)/(pwHi-pwLo)*(H-padT-padB);
    ctx.setLineDash([6*dpr,6*dpr]); ctx.strokeStyle = cs.getPropertyValue('--pw'); ctx.globalAlpha=.35; ctx.lineWidth=1.5*dpr;
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha=1;
  }
  plot('pw', cs.getPropertyValue('--pw'), pwLo, pwHi);
  plot('hr', cs.getPropertyValue('--hr'), hrLo, hrHi);
}
setInterval(drawChart, 1000);
window.addEventListener('resize', drawChart);

/* ---------- Innstillinger-dialog ---------- */
const dlg = $('dlg');
$('btnSettings').onclick = () => {
  $('setMaxHr').value = cfg.maxHr; $('setCp').value = cfg.cp; $('setPwS').value = cfg.pwS;
  $('setPaceS').value = cfg.paceS; $('setCadX2').checked = cfg.cadX2; $('setAuto').checked = cfg.auto;
  dlg.showModal();
};
$('dlgCancel').onclick = () => dlg.close();
$('dlgSave').onclick = () => {
  const n = (id, d) => { const v = +$(id).value; return v>0 ? v : d; };
  cfg.maxHr = n('setMaxHr', DEF.maxHr); cfg.cp = n('setCp', DEF.cp);
  cfg.pwS = Math.round(n('setPwS', DEF.pwS)); cfg.paceS = Math.round(n('setPaceS', DEF.paceS));
  cfg.cadX2 = $('setCadX2').checked; cfg.auto = $('setAuto').checked;
  saveCfg(); dlg.close(); render(); drawChart();
};

/* ---------- Demomodus ---------- */
const demo = { on:false, t:null, k:0 };
function stopDemo(){ clearInterval(demo.t); demo.on=false; $('btnDemo').classList.remove('primary');
  ['hr','st'].forEach(k=>{ if(!dev[k]) chip(k,'off','trykk for å koble til'); }); }
$('btnDemo').onclick = () => {
  if (demo.on) return stopDemo();
  demo.on = true; $('btnDemo').classList.add('primary');
  chip('hr','on','DEMO'); chip('st','on','DEMO');
  demo.t = setInterval(() => {
    demo.k++;
    const interval = Math.floor(demo.k/240)%2 === 1;      // 1 min rolig, 1 min hardt
    const target = interval ? 4.4 : 3.2;
    const spd = target + Math.sin(demo.k/7)*0.05;
    const view = r => new DataView(new Uint8Array(r).buffer);
    const s = Math.round(spd*256);
    onRsc(view([0, s&255, s>>8, 88]));
    const w = Math.round((interval?330:245) + Math.random()*16-8);
    onPower(view([0,0, w&255, w>>8]));
    const hrT = interval ? 172 : 148;
    live._demoHr = (live._demoHr ?? 130) + (hrT - (live._demoHr ?? 130))*0.01;
    onHr(view([0, Math.round(live._demoHr + Math.random()*2)]));
  }, 250);
};

render(); drawChart();
})();
</script>
